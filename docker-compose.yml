services:
  postgres:
    image: postgres:16-alpine
    container_name: sketchsync-postgres
    env_file:
      - ./packages/db/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.http
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/http-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:12345678@postgres:5432/sketchsync
    command: sh -c "cd packages/db && pnpm run push"
    restart: "no"

  http-backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.http
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/http-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:12345678@postgres:5432/sketchsync
  ws-backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.ws
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/ws-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:12345678@postgres:5432/sketchsync
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - http-backend

volumes:
  pgdata: